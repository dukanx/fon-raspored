name: Check FON for new PDFs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pdfplumber pymupdf requests beautifulsoup4

      - name: Check and parse new PDFs
        id: check
        run: python scripts/check_fon.py

      - name: Commit if changed
        run: |
          git config user.name "FON Bot"
          git config user.email "bot@fonraspored.rs"
          git add public/data/rokovi.json scripts/known_pdfs.json
          git diff --staged --quiet || (git commit -m "${COMMIT_MSG:-auto: update rokova}" && git push)

      - name: Set up Node
        if: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        if: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
        run: npm ci

      - name: Send push notifications
        if: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node scripts/send_push.mjs new
          node scripts/send_push.mjs reminders
