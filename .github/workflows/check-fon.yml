name: Check FON for new PDFs

on:
  schedule:
    # Tri pokušaja jer GitHub cron ume da kasni/preskoči zakazane run-ove,
    # pogotovo na pun sat. Minut 7 i ne-pun-sat smanjuju propuštanja.
    # 08:07 UTC = 10:07 po Beogradu (letnje vreme); pa 11:07 i 12:07 kao rezerva.
    # Dedup u send_push.mjs sprečava duple notifikacije.
    - cron: '7 8,9,10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # secrets nije dozvoljen u `if:`, pa ga ovde mapiramo u env ('true'/'false').
    env:
      HAS_PUSH: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pdfplumber pymupdf requests beautifulsoup4

      - name: Check and parse new PDFs
        id: check
        run: python scripts/check_fon.py

      # Kalendar aktivnosti (boje dana u Rokovima). Ako stranica ne izgleda
      # kako očekujemo, stari kalendar ostaje, a otvara se issue (ispod).
      - name: Osveži kalendar aktivnosti
        id: kalendar
        continue-on-error: true
        working-directory: scripts
        run: python scrape_kalendar.py

      - name: Prijavi problem sa kalendarom (issue)
        if: steps.kalendar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Kalendar aktivnosti se ne može pročitati"
          if [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')" ]; then
            gh issue create --title "$TITLE" --body "scripts/scrape_kalendar.py nije uspeo (v. log u Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Aplikacija i dalje koristi poslednji ispravan kalendar."
          fi

      - name: Commit if changed
        run: |
          git config user.name "FON Bot"
          git config user.email "bot@fonraspored.rs"
          git add public/data/rokovi.json scripts/known_pdfs.json public/data/kalendar.json
          if git diff --staged --quiet -- public/data/rokovi.json scripts/known_pdfs.json; then
            MSG="auto: ažuriran kalendar aktivnosti"
          else
            MSG="${COMMIT_MSG:-auto: update rokova}"
          fi
          git diff --staged --quiet || (git commit -m "$MSG" && git push)

      # Push za nove rokove ne sme da stigne pre nego što sajt servira novi
      # rokovi.json, ni pre nego što istekne keš browsera (/data ima max-age=600,
      # v. next.config.ts) - inače bi korisnik na klik video stare rokove.
      # pending_notify.json nije u repou, pa push koji ne ode u ovom run-u je
      # izgubljen: posle 20 min bez novog deploy-a šaljemo svejedno.
      - name: Sačekaj da sajt servira nove rokove
        if: ${{ env.HAS_PUSH == 'true' }}
        env:
          SITE_URL: https://www.fonraspored.rs
        run: |
          if [ ! -f scripts/pending_notify.json ] || [ "$(jq length scripts/pending_notify.json)" = "0" ]; then
            echo "Nema novih rokova za obaveštenje."
            exit 0
          fi
          WANT=$(jq -S . public/data/rokovi.json | sha256sum | cut -c1-12)
          for i in $(seq 1 40); do
            LIVE=$(curl -fsSL "$SITE_URL/data/rokovi.json?t=$(date +%s)" | jq -S . | sha256sum | cut -c1-12 || true)
            echo "Pokušaj $i: sajt servira $LIVE (čekamo $WANT)"
            if [ "$LIVE" = "$WANT" ]; then
              echo "Sajt servira nove rokove, čekamo još 10 min da istekne keš browsera."
              sleep 600
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Sajt ni posle 20 min ne servira nove rokove, push ide svejedno."

      - name: Set up Node
        if: ${{ env.HAS_PUSH == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        if: ${{ env.HAS_PUSH == 'true' }}
        run: npm ci

      - name: Send push notifications
        if: ${{ env.HAS_PUSH == 'true' }}
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node scripts/send_push.mjs new
          node scripts/send_push.mjs reminders
