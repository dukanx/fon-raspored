name: Obavesti o novom rasporedu nastave

# Kad se na main objavi god.json (update-nastava.yml), pošalji push:
#   - nov semestar (`semester` string se promenio) -> "Objavljen je raspored", svima
#   - isti semestar, a izmenjeni termini, sale ili predmeti -> "Raspored nastave
#     je izmenjen", samo grupama kojima se raspored promenio (scripts/
#     izmenjene-grupe.ts). Pretplate bez zapamćene grupe je dobijaju svakako.
on:
  push:
    branches: [main]
    paths:
      - 'public/data/1god.json'
      - 'public/data/2god.json'
      - 'public/data/3god.json'
      - 'public/data/4god.json'
  # update-nastava.yml ga pokreće posle objave i šalje `before` (commit pre
  # objave), jer push iz workflow-a ne pokreće ovaj workflow sam. Ručno
  # pokretanje bez `before` šalje kao za nov semestar.
  workflow_dispatch:
    inputs:
      before:
        description: 'Commit pre objave (prazno = pošalji kao nov semestar)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      HAS_PUSH: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
      SITE_URL: https://www.fonraspored.rs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # mode: nastava (nov semestar), izmena (izmenjene grupe) ili prazno.
      # version: otisak svih termina svih godina, po njemu se prepoznaje da sajt
      # servira novu verziju i da ista izmena ne stigne dvaput.
      - name: Šta se promenilo?
        id: sem
        run: |
          entries() { for y in 1 2 3 4; do "$@" "$y" | jq -c .entries; done | sha256sum | cut -c1-12; }
          now() { cat "public/data/${1}god.json"; }

          NEW=$(jq -r .semester public/data/1god.json)
          BEFORE="${{ github.event.before || inputs.before }}"
          OLD=""
          GRUPE=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            OLD=$(git show "$BEFORE:public/data/1god.json" | jq -r .semester)
            mkdir -p "$RUNNER_TEMP/staro"
            for y in 1 2 3 4; do git show "$BEFORE:public/data/${y}god.json" > "$RUNNER_TEMP/staro/${y}god.json"; done
            GRUPE=$(npx vite-node scripts/izmenjene-grupe.ts "$RUNNER_TEMP/staro")
          fi
          VERSION=$(entries now)
          echo "Staro: '$OLD' | novo: '$NEW' | verzija: $VERSION"
          echo "Izmenjene grupe: ${GRUPE:-nema}"
          echo "semester=$NEW" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "grupe=$GRUPE" >> "$GITHUB_OUTPUT"
          # Ručno pokretanje bez `before` šalje kao za nov semestar (dedup u
          # send_push.mjs ipak sprečava duplikat).
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.before }}" ]; } || [ "$OLD" != "$NEW" ]; then
            echo "mode=nastava" >> "$GITHUB_OUTPUT"
          elif [ -n "$GRUPE" ]; then
            echo "mode=izmena" >> "$GITHUB_OUTPUT"
          else
            echo "mode=" >> "$GITHUB_OUTPUT"
          fi

      # Push ne sme da stigne pre nego što Cloudflare objavi novi deploy - inače
      # bi korisnik kliknuo i video stari raspored. Čekamo do 20 min. Kad sajt
      # servira novu verziju, još 10 min: /data ima max-age=600 (public/_headers),
      # pa ko je otvorio aplikaciju malo pre objave, ima staru kopiju u browseru.
      - name: Sačekaj da sajt servira novi raspored
        if: ${{ steps.sem.outputs.mode != '' && env.HAS_PUSH == 'true' }}
        env:
          VERSION: ${{ steps.sem.outputs.version }}
        run: |
          live() { curl -fsSL "$SITE_URL/data/${1}god.json?t=$(date +%s)"; }
          for i in $(seq 1 40); do
            LIVE=$(for y in 1 2 3 4; do live "$y" | jq -c .entries || true; done | sha256sum | cut -c1-12)
            echo "Pokušaj $i: sajt servira verziju $LIVE (čekamo $VERSION)"
            if [ "$LIVE" = "$VERSION" ]; then
              echo "Sajt servira novu verziju, čekamo još 10 min da istekne keš browsera."
              sleep 600
              exit 0
            fi
            sleep 30
          done
          echo "Sajt i dalje ne servira novu verziju - ne šaljem." >&2
          exit 1

      - name: Pošalji push
        if: ${{ steps.sem.outputs.mode != '' && env.HAS_PUSH == 'true' }}
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SEM: ${{ steps.sem.outputs.semester }}
          VERSION: ${{ steps.sem.outputs.version }}
          GRUPE: ${{ steps.sem.outputs.grupe }}
        run: |
          if [ "${{ steps.sem.outputs.mode }}" = "izmena" ]; then
            node scripts/send_push.mjs nastava-izmena "$SEM" "$VERSION" "$GRUPE"
          else
            node scripts/send_push.mjs nastava "$SEM"
          fi
