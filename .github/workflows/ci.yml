name: CI

# Provera koda na svaki PR i push na main: lint, typecheck i build.
# Cilj je da se ne merge-uje kod koji ne prolazi lint, ne tipizira ili ne builda.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run pytest
        working-directory: scripts
        run: python -m pytest
