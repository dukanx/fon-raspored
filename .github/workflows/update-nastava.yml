name: Ažuriraj raspored nastave

# Ručno, ili na svakih 30 min u mesecima kad FON objavljuje raspored (septembar
# i oktobar za zimski, februar i mart za letnji). Zakazano pokretanje prvo brzo
# proveri ima li na FON-u nešto novo (--check): semestar noviji od objavljenog,
# ili nova verzija objavljenog (drugi linkovi ili sadržaj nego u
# known_nastava.json). Ako nema, tu staje. Ako ima i menjali su se samo sale i
# termini, upisuje direktno na main. Ako je nov semestar ili su se menjali
# predmeti, otvara PR, a merge pokreće push (notify-nastava.yml).
on:
  schedule:
    - cron: '*/30 * * 9,10,2,3 *'
  workflow_dispatch:
    inputs:
      semester:
        description: 'Semestar'
        type: choice
        options: [auto, letnji, zimski]
        default: auto
      years:
        description: 'Godine (npr. "4" ili "1,2,3,4")'
        default: '1,2,3,4'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Kod zakazanog pokretanja `inputs` su prazni, pa podrazumevane vrednosti
      # idu preko `||`. Semestar se ne pogađa po mesecu (auto bi u septembru
      # rekao letnji), nego ga daje --check.
      - name: Ima li nešto novo na FON-u?
        id: check
        if: github.event_name == 'schedule'
        run: |
          pip install beautifulsoup4
          SEM=$(python scripts/update_nastava.py --check --years "${{ inputs.years || '1,2,3,4' }}")
          echo "semester=$SEM" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.check.outputs.semester != ''
        run: pip install pdfplumber beautifulsoup4

      - name: Regeneriši raspored nastave
        if: github.event_name != 'schedule' || steps.check.outputs.semester != ''
        run: |
          ARGS="--years ${{ inputs.years || '1,2,3,4' }}"
          SEM="${{ steps.check.outputs.semester || inputs.semester }}"
          if [ -n "$SEM" ] && [ "$SEM" != "auto" ]; then
            ARGS="$ARGS --semester $SEM"
          fi
          python scripts/update_nastava.py $ARGS

      # Isti semestar i isti spisak predmeta (FON menjao samo sale i termine)
      # -> upis direktno na main, bez PR-a i bez notifikacije. Nov semestar ili
      # promena predmeta -> PR, pa merge radiš ti, a on šalje push.
      - name: Da li su se menjali predmeti?
        id: diff
        if: github.event_name != 'schedule' || steps.check.outputs.semester != ''
        run: |
          subjects() { for y in 1 2 3 4; do "$@" "$y" | jq -r '.entries[].subject'; done | sort -u; }
          now() { cat "public/data/${1}god.json"; }
          committed() { git show "HEAD:public/data/${1}god.json"; }
          if git diff --quiet -- public/data scripts/known_nastava.json; then
            KIND=none
          elif [ "$(now 1 | jq -r .semester)" = "$(committed 1 | jq -r .semester)" ] \
              && [ "$(subjects now)" = "$(subjects committed)" ]; then
            KIND=direct
          else
            KIND=pr
          fi
          echo "Izmena: $KIND"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Upiši izmene direktno na main
        if: steps.diff.outputs.kind == 'direct'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*god.json public/data/*god-letnji.json public/data/*god-zimski.json scripts/known_nastava.json
          git commit -m "auto: izmene sala i termina u rasporedu nastave"
          git push

      # Ako PR na grani auto/raspored-nastave već postoji, samo se osveži.
      - name: Napravi Pull Request
        if: steps.diff.outputs.kind == 'pr'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/raspored-nastave
          delete-branch: true
          title: 'auto: ažuriran raspored nastave'
          commit-message: 'auto: ažuriran raspored nastave (god.json)'
          body: |
            Automatski regenerisan raspored nastave sa FON sajta
            (`scripts/update_nastava.py`).

            Pregledaj diff pre merge-a - posebno proveri da nije nešto
            neočekivano nestalo. Sigurnosna provera već odbacuje regresiju
            (manje predmeta/grupa nego u istom semestru ranije).

            Merge novog semestra šalje push svim pretplatnicima.
          # Arhive po semestru idu uz god.json: sa njima poredi sigurnosna
          # provera, a mešani Sep/Okt rokovi iz njih nude predmete.
          add-paths: |
            public/data/1god.json
            public/data/2god.json
            public/data/3god.json
            public/data/4god.json
            public/data/*god-letnji.json
            public/data/*god-zimski.json
            scripts/known_nastava.json
